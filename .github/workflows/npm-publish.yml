name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "publish" to publish the current package.json version.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish current version
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Validate manual confirmation
        if: inputs.confirm != 'publish'
        run: |
          echo 'Refusing to publish: confirmation input must be exactly "publish".'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 CI 主验证矩阵中的 LTS 对齐，避免 publish 专用 Node 与日常测试版本漂移
          # npm Trusted Publishing 要求 Node.js 22.14.0 或更高。
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm version with trusted publishing support
        run: npm install -g npm@11

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Read package metadata
        id: package
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const pkg = require('./package.json');
          const stablePattern = /^\d+\.\d+\.\d+$/;
          const canaryPattern = /^\d+\.\d+\.\d+-canary\.(?:0|[1-9]\d*)$/;
          const channel = stablePattern.test(pkg.version)
            ? 'stable'
            : canaryPattern.test(pkg.version)
              ? 'canary'
              : undefined;
          if (channel === undefined) {
            throw new Error(`版本 ${pkg.version} 既不是 Stable，也不是规范 Canary`);
          }
          console.log('name=' + pkg.name);
          console.log('version=' + pkg.version);
          console.log('channel=' + channel);
          NODE

      - name: Ensure version is not already published
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version already exists on npm: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Require an existing Canary before Stable publish
        if: steps.package.outputs.channel == 'stable'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const canaryPattern = /^\d+\.\d+\.\d+-canary\.(?:0|[1-9]\d*)$/;
          const sriPattern = /^sha512-[A-Za-z0-9+/]+={0,2}$/;

          // Stable 发布不可回滚；在上传前确认 Canary 标签和精确制品元数据均已存在且规范。
          const canaryVersion = execFileSync(
            'npm',
            ['view', process.env.PACKAGE_NAME, 'dist-tags.canary'],
            { encoding: 'utf8' }
          ).trim();
          if (!canaryPattern.test(canaryVersion)) {
            throw new Error(`Stable 发布前必须存在规范 Canary 标签，当前值：${canaryVersion || '<missing>'}`);
          }

          const metadata = JSON.parse(execFileSync(
            'npm',
            ['view', `${process.env.PACKAGE_NAME}@${canaryVersion}`, 'version', 'dist.integrity', '--json'],
            { encoding: 'utf8' }
          ));
          const integrity = metadata['dist.integrity'];
          const encoded = typeof integrity === 'string' && sriPattern.test(integrity)
            ? integrity.slice('sha512-'.length)
            : '';
          const decoded = Buffer.from(encoded, 'base64');
          if (
            metadata.version !== canaryVersion
            || decoded.length !== 64
            || decoded.toString('base64') !== encoded
          ) {
            throw new Error('Stable 发布前的 Canary 精确版本或 SHA-512 SRI 校验失败');
          }
          NODE

      - name: Publish package
        run: npm publish --access public --provenance --tag "${{ steps.package.outputs.channel == 'stable' && 'latest' || 'canary' }}"

      - name: Synchronize stable dist-tag
        # 正式发布同步当前版本；首次 Canary 发布可从既有 latest 建立 stable 基线，但拒绝静默修正已有分叉。
        env:
          # Trusted Publishing 负责 publish；该最小权限、短有效期 token 只用于 npm 尚未覆盖的 dist-tag 写操作。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_CHANNEL: ${{ steps.package.outputs.channel }}
        run: |
          latest_version="$(npm view "$PACKAGE_NAME" dist-tags.latest)"
          stable_version="$(npm view "$PACKAGE_NAME" dist-tags.stable 2>/dev/null || true)"
          if [ "$PACKAGE_CHANNEL" = "stable" ]; then
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" stable
          elif [ -z "$stable_version" ]; then
            npm dist-tag add "$PACKAGE_NAME@$latest_version" stable
          elif [ "$stable_version" != "$latest_version" ]; then
            echo "Refusing to change divergent stable tag: latest=$latest_version stable=$stable_version"
            exit 1
          fi

      - name: Verify published channel
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_CHANNEL: ${{ steps.package.outputs.channel }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tags = JSON.parse(execFileSync('npm', ['view', process.env.PACKAGE_NAME, 'dist-tags', '--json'], { encoding: 'utf8' }));
          const tag = process.env.PACKAGE_CHANNEL === 'stable' ? 'stable' : 'canary';
          if (tags[tag] !== process.env.PACKAGE_VERSION) {
            throw new Error(`${tag} 标签未指向刚发布的版本`);
          }
          if (process.env.PACKAGE_CHANNEL === 'stable' && tags.latest !== process.env.PACKAGE_VERSION) {
            throw new Error('latest 标签未与 stable 同步');
          }
          if (tags.latest !== tags.stable) {
            throw new Error('latest 与 stable 标签发生分叉');
          }
          const metadata = JSON.parse(execFileSync('npm', ['view', `${process.env.PACKAGE_NAME}@${process.env.PACKAGE_VERSION}`, 'version', 'dist.integrity', '--json'], { encoding: 'utf8' }));
          if (metadata.version !== process.env.PACKAGE_VERSION || !String(metadata['dist.integrity'] ?? '').startsWith('sha512-')) {
            throw new Error('精确版本或 SRI 验证失败');
          }
          NODE

      - name: Verify complete Stable and Canary snapshot
        # npm 元数据存在短暂传播延迟；有限重试后仍失败时，由产品代码中的严格校验统一阻断。
        run: |
          for attempt in 1 2 3 4 5; do
            if node dist/index.js version check --json; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          echo 'Complete Stable/Canary release snapshot validation failed.'
          exit 1
